<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
            <div class="container-fluid pe-0 ">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav  mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" id="editar_usuario" aria-current="page"  href="./editar_brawler.html">Editar Brawler</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./eliminar_brawler.html">Eliminar Brawler</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav> 
    </header>
    <main>
        <div class="grid-container" id="brawlers-grid">
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        fetch('http://localhost:3000/api/v1/brawlers')
        .then(response => response.json())
        .then(brawlers => {
            console.log(brawlers);
            const gridContainer = document.getElementById('brawlers-grid');
            brawlers.forEach(brawler => {
                const brawlerCard = document.createElement('div');
                brawlerCard.classList.add('card', 'm-2');
                brawlerCard.style.width = '18rem';
                brawlerCard.innerHTML = `
                    <div class="card-body">
                        <div>
                            <img src="../imgs/${brawler.nombre}.png" class="card-img-top" alt="${brawler.nombre}">
                        </div>
                        <h5 class="card-title"> <strong> <a href="estadisticas_brawlers?id=${brawler.id}.html">${brawler.nombre}</a></strong> </h5>
                        <p class="card-text"><strong>ID:</strong> ${brawler.id}</p>
                    </div>
                `;
                gridContainer.appendChild(brawlerCard);
        });
        })
        .catch(error => console.error('Error fetching brawlers:', error));
    </script>
</body>
</html>
