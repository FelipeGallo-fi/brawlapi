<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Brawler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
            <div class="container-fluid pe-0 ">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav  mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./brawlers.html">Brawlers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./eliminar_brawler.html">Eliminar brawler</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="landing">
            <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
        </div>
        <div>
            <h1>Editar Brawler</h1>
        </div>
        <div>
            <form id="editarBrawlerForm" class="formUsuario">
                <div class="row mb-3">
                    <label for="inputID" class="col-sm-2 col-form-label">ID</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputID" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputTipo" class="col-sm-2 col-form-label">Tipo</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputTipo" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputRareza" class="col-sm-2 col-form-label">Rareza</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputRareza" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputDescripcion" class="col-sm-2 col-form-label">Descripción</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputDescripcion" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputAtaque" class="col-sm-2 col-form-label">Ataque</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputAtaque" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('editarBrawlerForm');
            const inputID = document.getElementById('inputID');
            const inputTipo = document.getElementById('inputTipo');
            const inputRareza = document.getElementById('inputRareza');
            const inputDescripcion = document.getElementById('inputDescripcion');
            const inputAtaque = document.getElementById('inputAtaque');

            inputID.addEventListener('change', function() {
                const id = parseInt(inputID.value, 10);
                if (!isNaN(id)) {
                    fetch(`http://localhost:3000/api/v1/brawler/${id}`)
                        .then(response => response.json())
                        .then(brawler => {
                            if (brawler) {
                                inputTipo.placeholder = brawler.tipo || '';
                                inputRareza.placeholder = brawler.rareza || '';
                                inputDescripcion.placeholder = brawler.descripcion || '';
                                inputAtaque.placeholder = brawler.ataque || ''; 
                            } else {
                                alert('Brawler no encontrado');
                            }
                        })
                        .catch(error => console.error('Error obteniendo brawlers:', error));
                }
            });

            if (form) {
                form.addEventListener('submit', function(event) {
                event.preventDefault();
                const id = parseInt(inputID.value, 10);
                const tipo = inputTipo.value || inputTipo.placeholder;
                const rareza = inputRareza.value || inputRareza.placeholder;
                const descripcion = inputDescripcion.value || inputDescripcion.placeholder;
                const ataque = inputAtaque.value || inputAtaque.placeholder;

                fetch(`http://localhost:3000/api/v1/brawler/${id}`, {
                    method: 'PUT',
                    headers: {
                    'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ tipo, rareza, descripcion, ataque })
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Brawler actualizado:', data);
                    alert('Brawler actualizado exitosamente');
                    form.reset();
                    window.location.href = './brawlers.html'; 
                })
                .catch(error => console.error('Error actualizando brawler:', error));
                });
            }
        });
    </script>
</body>
</html>
