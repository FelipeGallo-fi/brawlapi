<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Estadísticas del Brawler</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link rel="stylesheet" href="../style.css">
   </head>
   <body>
      <main>
         <h1 id="titulo">Estadísticas de </h1>
         <div id="brawlerStats">

         </div>
      </main>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <script>
         document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const brawlerId = urlParams.get('id');
            const titulo = document.getElementById("titulo")
            fetch(`http://localhost:3000/api/v1/brawler/${brawlerId}`)
               .then(response => response.json())
               .then(brawler => {
                  titulo.innerText += " " + brawler.nombre;
                  if (brawler) {
                  const statsDiv = document.getElementById('brawlerStats');
                  statsDiv.innerHTML = `
                     <p>Nombre: ${brawler.nombre}</p>
                     <p>Salud: ${brawler.salud}</p>
                     <p>Ataque: ${brawler.ataque}</p>
                     <p>Super: ${brawler.super}</p>
                     <p>Velocidad: ${brawler.velocidad}</p>
                  `;
                  } else {
                  alert('Brawler no encontrado');
                  }
               })
               .catch(error => console.error('Error obteniendo estadísticas del brawler:', error));
         });
      </script>
   </body>
</html>
