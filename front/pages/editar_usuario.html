<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
            <div class="container-fluid pe-0 ">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav  mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./usuarios.html">Usuarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" id="editar_usuario" aria-current="page"  href="./crear_usuario.html">Crear usuario</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./pages/miscelaneo.html">Eliminar Usuario</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="landing">
            <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
        </div>
        <div>
            <h1>Editar Usuario</h1>
        </div>
        <div>
            <form id="editarUsuarioForm">
                <div class="row mb-3">
                    <label for="inputID" class="col-sm-2 col-form-label">ID</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputID" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputNombre" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputNombre" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputEdad" class="col-sm-2 col-form-label">Edad</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="inputEdad" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputRegion" class="col-sm-2 col-form-label">Región</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputRegion" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputCopas" class="col-sm-2 col-form-label">Copas</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="inputCopas" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputBrawler" class="col-sm-2 col-form-label">Brawler Favorito</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputBrawler" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputMonedas" class="col-sm-2 col-form-label">Monedas</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="inputMonedas" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('editarUsuarioForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const id = parseInt(document.getElementById('inputID').value, 10);
                const nombre = document.getElementById('inputNombre').value;
                const region = document.getElementById('inputRegion').value;
                const edad = parseInt(document.getElementById('inputEdad').value, 10);
                const copas = parseInt(document.getElementById('inputCopas').value, 10);
                const brawlerNombre = document.getElementById('inputBrawler').value;
                const monedas = parseInt(document.getElementById('inputMonedas').value, 10);

                fetch(`http://localhost:3000/api/v1/brawlers?nombre=${encodeURIComponent(brawlerNombre)}`)
                    .then(response => response.json())
                    .then(brawlers => {
                        if (brawlers.length > 0) {
                            const brawlerFav = brawlers[0].id;

                            fetch(`http://localhost:3000/api/v1/usuario/${id}`, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ 
                                    nombre, 
                                    region, 
                                    edad, 
                                    copas, 
                                    brawlerFav, 
                                    monedas 
                                })
                            })
                            .then(response => response.json())
                            .then(data => {
                                console.log('Usuario editado:', data);
                                alert('Usuario editado exitosamente');
                                document.getElementById('editarUsuarioForm').reset();
                            })
                            .catch(error => console.error('Error editando usuario:', error));
                        } else {
                            alert('Brawler no encontrado');
                        }
                    })
                    .catch(error => console.error('Error buscando Brawler:', error));
            });
        });
    </script>
</body>
</html>
