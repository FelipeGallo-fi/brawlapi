<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
            <div class="container-fluid pe-0 ">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav  mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./usuarios.html">Usuarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" id="editar_usuario" aria-current="page"  href="./crear_usuario.html">Crear usuario</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./eliminar_usuario.html">Eliminar Usuario</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="landing">
            <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
        </div>
        <div>
            <h1>Editar Usuario</h1>
        </div>
        <div>
            <form id="editarUsuarioForm" class="formUsuario">
                <div class="row mb-3">
                    <label for="inputID" class="col-sm-2 col-form-label">ID</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputID" >
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputNombre" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputNombre" >
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputEdad" class="col-sm-2 col-form-label">Edad</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="inputEdad" >
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputRegion" class="col-sm-2 col-form-label">Región</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputRegion" >
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputBrawler" class="col-sm-2 col-form-label">Brawler Favorito</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputBrawler" >
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('editarUsuarioForm');
        const inputID = document.getElementById('inputID');
        const inputNombre = document.getElementById('inputNombre');
        const inputRegion = document.getElementById('inputRegion');
        const inputEdad = document.getElementById('inputEdad');
        const inputBrawler = document.getElementById('inputBrawler');

        inputID.addEventListener('change', function() {
            const id = parseInt(inputID.value, 10);
            if (!isNaN(id)) {
                fetch(`http://localhost:3000/api/v1/usuarios/${id}`)
                    .then(response => response.json())
                    .then(usuario => {
                        if (usuario) {
                            inputNombre.placeholder = usuario.nombre || '';
                            inputRegion.placeholder = usuario.region || '';
                            inputEdad.placeholder = usuario.edad || '';
                            inputBrawler.placeholder = "Nombre brawler favorito (id brawler favorito actual: " + usuario.brawlerFav + ")" || ''; 
                        } else {
                            alert('Usuario no encontrado');
                        }
                    })
                    .catch(error => console.error('Error obteniendo usuario:', error));
            }
        });

        if (form) {
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                const id = parseInt(inputID.value, 10);
                const nombre = inputNombre.value || inputNombre.placeholder;
                const region = inputRegion.value || inputRegion.placeholder;
                const edad = inputEdad.value ? parseInt(inputEdad.value, 10) : parseInt(inputEdad.placeholder, 10);
                const brawlerNombre = inputBrawler.value || inputBrawler.placeholder.split(': ')[1];

                if (inputBrawler.value && inputBrawler.value !== brawlerNombre) {
                    fetch('http://localhost:3000/api/v1/brawlers')
                        .then(response => response.json())
                        .then(brawlers => {
                            const brawler = brawlers.find(elemento => elemento.nombre.toLowerCase() === brawlerNombre.toLowerCase());
                            if (brawler && brawler.id) {
                                const brawlerFav = brawler.id;
                                fetch(`http://localhost:3000/api/v1/usuario/${id}`, {
                                    method: 'PUT',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({ nombre, region, edad, brawlerFav })
                                })
                                .then(response => response.json())
                                .then(data => {
                                    console.log('Usuario actualizado:', data);
                                    alert('Usuario actualizado exitosamente');
                                    form.reset();
                                })
                                .catch(error => console.error('Error actualizando usuario:', error));
                            } else {
                                alert('Brawler no encontrado');
                            }
                        })
                        .catch(error => console.error('Error buscando Brawler:', error));
                } else {
                    const brawlerFav = parseInt(inputBrawler.placeholder.split(': ')[1]);
                    fetch(`http://localhost:3000/api/v1/usuario/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ nombre, region, edad, brawlerFav })
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Usuario actualizado:', data);
                        alert('Usuario actualizado exitosamente');
                        form.reset();
                    })
                    .catch(error => console.error('Error actualizando usuario:', error));
                }
            });
        }
    });
</script>
</body>
</html>
