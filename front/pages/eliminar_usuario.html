<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Usuarios</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link rel="stylesheet" href="../style.css">
   </head>
   <body>
      <header>
         <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
               <div class="container-fluid pe-0 ">
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                     <ul class="navbar-nav  mb-2 mb-lg-0">
                           <li class="nav-item">
                              <a class="nav-link active" aria-current="page" href="./crear_usuario.html">Crear Usuario</a>
                           </li>
                           <li class="nav-item">
                              <a class="nav-link active" aria-current="page" href="./editar_usuario.html">Editar Usuario</a>
                           </li>
                           <li class="nav-item">
                              <a class="nav-link active" id="editar_usuario" aria-current="page"  href="./usuarios.html">Usuarios</a>
                           </li>
                     </ul>
                  </div>
               </div>
         </nav>
      </header>
      <main>
         <div id="landing">
               <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
         </div>
         <div>
            <h1 class="titulos">Eliminar usuario</h1>
         </div>
         <div class="contenedor">
               <table class="tabla">
                  <thead>
                     <tr>
                           <th scope="col">ID</th>
                           <th scope="col">USUARIO</th>
                           <th scope="col">EDAD</th>
                           <th scope="col">REGION</th>
                           <th scope="col">COPAS</th>
                           <th scope="col">MONEDAS</th>
                           <th scope="col">BRAWLER FAVORITO</th>
                     </tr>
                  </thead>
                  <tbody id="contenidoUsuarios">
                  </tbody>
               </table>
         </div>
         <div class="contenedor eliminarForm">
               <form id="eliminarUsuarioForm">
                  <div class="row ">
                     <label for="inputID" class="col-sm-2 col-form-label">ID</label>
                     <div class="col-sm-10">
                           <input type="text" class="form-control" id="inputID" required>
                     </div>
                  </div>
                  <div class="row">
                     <div class="col-sm-10">
                           <button type="submit" class="btn btn-danger">Eliminar</button>
                     </div>
                  </div>
               </form>
         </div>
      </main>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <script>
         fetch('http://localhost:3000/api/v1/usuarios')
         .then(response => response.json())
         .then(data => {
               console.log(data);
               data.forEach(usuario => {
                  const tr = document.createElement('tr');
                  tr.innerHTML = `
                     <td>${usuario.id}</td>
                     <td>${usuario.nombre}</td>
                     <td>${usuario.edad}</td>
                     <td>${usuario.region}</td>
                     <td>${usuario.copas}</td>
                     <td>${usuario.monedas}</td>
                     <td>${usuario.brawlerFav}</td>
                  `;
                  document.getElementById('contenidoUsuarios').appendChild(tr);
               });
         });

         document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('eliminarUsuarioForm').addEventListener('submit', function(event) {
               event.preventDefault();
               const id = parseInt(document.getElementById('inputID').value, 10);

               fetch(`http://localhost:3000/api/v1/usuario/${id}`, {
                  method: 'DELETE'
               })
               .then(response => {
                  if (response.ok) {
                     alert('Usuario eliminado exitosamente');
                     document.getElementById('eliminarUsuarioForm').reset();
                     window.location.href = './usuarios.html'; 
                  } else {
                     alert('Error eliminando usuario');
                  }
               })
               .catch(error => console.error('Error eliminando usuario:', error));
         });
      });
      </script>

   </body>

</html>
