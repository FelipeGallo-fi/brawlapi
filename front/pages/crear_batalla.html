<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Batalla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
            <div class="container-fluid pe-0 ">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav  mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./batallas.html">Batallas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" id="editar_usuario" aria-current="page"  href="./editar_batalla.html">Editar Batallas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./eliminar_batalla.html">Eliminar Batallas</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="landing">
            <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
        </div>
        <div>
            <h1>Crear Batalla</h1>
        </div>
        <div>

            <form id="crearBatallaForm" class="formUsuario">
                <div class="row mb-3">
                    <label for="inputFecha" class="col-sm-2 col-form-label">Fecha</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="inputFecha" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputUsuario" class="col-sm-2 col-form-label">Usuario</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputUsuario" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputBrawler" class="col-sm-2 col-form-label">Brawler</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputBrawler" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputResultado" class="col-sm-2 col-form-label">Resultado</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputResultado" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('crearBatallaForm');
            if (form) {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();
                    const fecha = document.getElementById('inputFecha').value;
                    const usuarioId = parseInt(document.getElementById('inputUsuario').value);
                    const brawlerNombre= document.getElementById('inputBrawler').value;
                    const resultado = document.getElementById('inputResultado').value;

                    const batalla = {
                        fecha,
                        usuarioId,
                        brawlerNombre,
                        resultado
                    };

                    fetch('http://localhost:3000/api/v1/batallas', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(batalla)
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Batalla creada:', data);
                        alert('Batalla creada exitosamente');
                        form.reset();
                        window.location.href = './batallas.html'; // Redirigir a la página de batallas
                    })
                    .catch(error => console.error('Error creando batalla:', error));
                });
            }
        });
    </script>
</body>
</html>
