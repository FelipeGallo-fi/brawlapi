<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Batalla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
            <div class="container-fluid pe-0">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./crear_usuario.html">Crear Usuario</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./editar_usuario.html">Editar Usuario</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./usuarios.html">Usuarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./eliminar_batalla.html">Eliminar Batalla</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="landing">
            <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
        </div>
        <div>
            <h1 class="titulos">Eliminar Batalla</h1>
        </div>
        <div class="contenedor">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Brawler</th>
                        <th>Resultado</th>
                    </tr>
                </thead>
                <tbody id="contenidoBatallas">
                    <!-- Las batallas se cargarán aquí -->
                </tbody>
            </table>
        </div>
        <div class="contenedor eliminarForm">
               <form id="eliminarUsuarioForm">
                <div class="row mb-3">
                    <label for="inputID" class="col-sm-2 col-form-label">ID</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputID" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-10">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Cargar las batallas y mostrarlas en la tabla
            fetch('http://localhost:3000/api/v1/batallas')
                .then(response => response.json())
                .then(batallas => {
                    const contenidoBatallas = document.getElementById('contenidoBatallas');
                    contenidoBatallas.innerHTML = ''; 
                    batallas.forEach(batalla => {
                        const tr = document.createElement('tr');
                        tr.id = `batalla-${batalla.id}`;
                        tr.innerHTML = `
                            <td>${batalla.id}</td>
                            <td>${new Date(batalla.fecha).toLocaleDateString()}</td>
                            <td>${batalla.usuario.nombre}</td>
                            <td>${batalla.brawler.nombre}</td>
                            <td>${batalla.resultado}</td>
                        `;
                        contenidoBatallas.appendChild(tr);
                    });
                })
                .catch(error => console.error('Error fetching batallas:', error));

            // Manejar el envío del formulario para eliminar una batalla
            document.getElementById('eliminarBatallaForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const id = document.getElementById('inputID').value;
                fetch(`http://localhost:3000/api/v1/batallas/${id}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('Batalla eliminada exitosamente');
                        // Eliminar la fila de la tabla
                        const fila = document.getElementById(`batalla-${id}`);
                        if (fila) {
                            fila.remove();
                        }
                        document.getElementById('eliminarBatallaForm').reset();
                    } else {
                        alert('Error al eliminar la batalla');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al eliminar la batalla');
                });
            });
        });
    </script>
</body>
</html>
