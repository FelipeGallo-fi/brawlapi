<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
            <div class="container-fluid pe-0 ">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav  mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./usuarios.html">Usuarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" id="editar_usuario" aria-current="page"  href="./editar_usuario.html">Editar Usuario</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./eliminar_usuario.html">Eliminar Usuario</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="landing">
            <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
        </div>
        <div>
            <h1 class="titulos">Crear Usuario</h1>
        </div>
        <div>

            <form id="crearUsuarioForm" class="formUsuario">
                <div class="row mb-3">
                    <label for="inputNombre" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputNombre" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputEdad" class="col-sm-2 col-form-label">Edad</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="inputEdad" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputRegion" class="col-sm-2 col-form-label">Región</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputRegion" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputBrawler" class="col-sm-2 col-form-label">Brawler Favorito</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputBrawler" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Crear usuario</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('crearUsuarioForm');
            if (form) {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();
                    const nombre = document.getElementById('inputNombre').value;
                    const region = document.getElementById('inputRegion').value;
                    const edad = parseInt(document.getElementById('inputEdad').value, 10);
                    const brawlerNombre = document.getElementById('inputBrawler').value;
                    console.log(brawlerNombre);

                    fetch('http://localhost:3000/api/v1/brawlers')
                    .then(response => response.json())
                    .then(brawlers => {
                        const brawler = brawlers.find(elemento => elemento.nombre.toLowerCase() === brawlerNombre.toLowerCase());
                        if (brawler && brawler.id) {
                            const brawlerFav = brawler.id;
                            fetch('http://localhost:3000/api/v1/usuarios', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ nombre, region, edad, brawlerFav })
                            })
                            .then(response => response.json().then(data => ({ status: response.status, body: data })))
                            .then(({ status, body }) => {
                                if (status >= 200 && status < 300) {
                                    console.log('Usuario creado:', body);
                                    alert('Usuario creado exitosamente');
                                    window.location.href = './usuarios.html';
                                    form.reset();
                                    window.location.href = './usuarios.html';
                                } else {
                                    alert(`Error: ${body.error}`);
                                }
                            })
                            .catch(error => {
                                alert(`Error: ${error.message}`);
                            });
                        } else {
                            alert('Brawler no encontrado');
                        }
                    })
                    .catch(error => {
                        alert(`Error: ${error.message}`);
                    });
            }); 
        }
    });
    </script>
</body>
</html>
