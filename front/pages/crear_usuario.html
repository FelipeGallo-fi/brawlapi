<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Crear Usuario</h1>
    </header>
    <main>
        <div id="landing">
            <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
        </div>
        <div>
            <form id="crearUsuarioForm">
                <div class="row mb-3">
                    <label for="inputNombre" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputNombre" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputEdad" class="col-sm-2 col-form-label">Edad</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="inputEdad" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputRegion" class="col-sm-2 col-form-label">Región</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputRegion" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputCopas" class="col-sm-2 col-form-label">Copas</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="inputCopas" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputBrawler" class="col-sm-2 col-form-label">Brawler Favorito</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputBrawler" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputMonedas" class="col-sm-2 col-form-label">Monedas</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="inputMonedas" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('crearUsuarioForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const nombre = document.getElementById('inputNombre').value;
                const region = document.getElementById('inputRegion').value;
                const edad = parseInt(document.getElementById('inputEdad').value, 10);
                const copas = parseInt(document.getElementById('inputCopas').value, 10);
                const brawlerNombre = document.getElementById('inputBrawler').value;
                const monedas = parseInt(document.getElementById('inputMonedas').value, 10);

                fetch(`http://localhost:3000/api/v1/brawlers?nombre=${encodeURIComponent(brawlerNombre)}`)
                    .then(response => response.json())
                    .then(brawlers => {
                        if (brawlers.length > 0) {
                            const brawlerFav = brawlers[0].id;
                            console.log('Brawler encontrado:', brawlerFav);

                            fetch('http://localhost:3000/api/v1/usuarios', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ nombre, region, edad, copas, brawlerFav, monedas })
                            })
                            .then(response => response.json())
                            .then(data => {
                                console.log('Usuario creado:', data);
                                alert('Usuario creado exitosamente');
                                document.getElementById('crearUsuarioForm').reset();
                            })
                            .catch(error => console.error('Error creando usuario:', error));
                        } else {
                            alert('Brawler no encontrado');
                        }
                    })
                    .catch(error => console.error('Error buscando Brawler:', error));
            });
        });
    </script>
</body>
</html>
