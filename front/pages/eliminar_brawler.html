<!DOCTYPE html>
<html lang="es">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Eliminar Brawler</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link rel="stylesheet" href="../style.css">
   </head>
   <body>
      <header>
         <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
               <div class="container-fluid pe-0 ">
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                     <ul class="navbar-nav  mb-2 mb-lg-0">
                           <li class="nav-item">
                              <a class="nav-link active" aria-current="page" href="./brawlers.html">Brawlers</a>
                           </li>
                           <li class="nav-item">
                              <a class="nav-link active" id="editar_brawler" aria-current="page"  href="./editar_brawler.html">Editar Brawler</a>
                           </li>
                           <li class="nav-item">
                              <a class="nav-link active" aria-current="page" href="./eliminar_brawler.html">Eliminar Brawler</a>
                           </li>
                     </ul>
                  </div>
               </div>
         </nav>
      </header>
      <main>
         <div id="landing">
               <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
         </div>
         <div>
            <h1>Eliminar Brawler</h1>
         </div>
         <div class="contenedor">
               <table class="tabla">
                  <thead>
                     <tr>
                           <th scope="col">ID</th>
                           <th scope="col">NOMBRE</th>
                           <th scope="col">TIPO</th>
                           <th scope="col">RAREZA</th>
                           <th scope="col">DESCRIPCIÓN</th>
                           <th scope="col">ATAQUE</th>
                           <th scope="col">SUPER</th>
                           <th scope="col">STAR POWER</th>
                           <th scope="col">GADGET</th>
                     </tr>
                  </thead>
                  <tbody id="contenidoBrawlers">
                  </tbody>
               </table>
         </div>
         <div class="contenedor eliminarForm">
               <form id="eliminarBrawlerForm">
                  <div class="row ">
                     <label for="inputID" class="col-sm-2 col-form-label">ID</label>
                     <div class="col-sm-10">
                           <input type="text" class="form-control" id="inputID" required>
                     </div>
                  </div>
                  <div class="row">
                     <div class="col-sm-10">
                           <button type="submit" class="btn btn-danger">Eliminar</button>
                     </div>
                  </div>
               </form>
         </div>
      </main>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <script>
         fetch('http://localhost:3000/api/v1/brawlers')
         .then(response => response.json())
         .then(data => {
               console.log(data);
               data.forEach(brawler => {
                  const tr = document.createElement('tr');
                  tr.innerHTML = `
                     <td>${brawler.id}</td>
                     <td>${brawler.nombre}</td>
                     <td>${brawler.tipo}</td>
                     <td>${brawler.rareza}</td>
                     <td>${brawler.descripcion}</td>
                     <td>${brawler.ataque}</td>
                     <td>${brawler.super}</td>
                     <td>${brawler.starPower}</td>
                     <td>${brawler.gadget}</td>
                  `;
                  document.getElementById('contenidoBrawlers').appendChild(tr);
               });
         });

         document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('eliminarBrawlerForm').addEventListener('submit', function(event) {
               event.preventDefault();
               const id = parseInt(document.getElementById('inputID').value, 10);

               fetch('http://localhost:3000/api/v1/usuarios')
                  .then(response => response.json())
                  .then(usuarios => {
                        const esFavorito = usuarios.some(usuario => usuario.brawlerFav === id);
   
                        if (esFavorito) {
                           alert('No se puede eliminar el brawler porque es el favorito de algún usuario');
                           return;
                        }

                        fetch('http://localhost:3000/api/v1/brawlers')
                           .then(response => response.json())
                           .then(brawlers => {
                              if (brawlers.length <= 2) {
                                    alert('Debe haber al menos 2 brawlers en la base de datos');
                                    return;
                              }

                              fetch(`http://localhost:3000/api/v1/brawler/${id}`, {
                                    method: 'DELETE'
                              })
                              .then(response => {
                                    if (response.ok) {
                                       alert('Brawler eliminado exitosamente');
                                       document.getElementById('eliminarBrawlerForm').reset();
                                       window.location.reload();
                                    } else {
                                       alert('Error eliminando brawler');
                                    }
                              })
                              .catch(error => console.error('Error eliminando brawler:', error));
                           })
                           .catch(error => console.error('Error obteniendo brawlers:', error));
                  })
                  .catch(error => console.error('Error obteniendo usuarios:', error));
            });
      });
      </script>
   </body>
</html>
