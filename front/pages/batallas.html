
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg top-0 position-fixed w-100">
            <div class="container-fluid pe-0 ">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav  mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./crear_batalla.html">Crear Batalla</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" id="editar_usuario" aria-current="page"  href="./editar_batalla.html">Editar Batalla</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./eliminar_batalla.html">Eliminar Batala</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="landing">
            <a href="../index.html"><img src="../imgs/logo.jpeg" alt="Brawl stars"></a>
        </div>
        
        </div>
        <div class="contenedor">
            <table class="tabla">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">FECHA</th>
                        <th scope="col">USUARIO</th>
                        <th scope="col">BRAWLER</th>
                        <th scope="col">RESULTADO</th>
                    </tr>
                </thead>
                <tbody id="contenidoBatallas">
                </tbody>
            </table>
        </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('http://localhost:3000/api/v1/batallas')
                .then(response => response.json())
                .then(batallas => {
                    batallas.sort((a, b) => a.id - b.id);
                    const contenidoBatallas = document.getElementById('contenidoBatallas');
                    contenidoBatallas.innerHTML = ''; 
                    batallas.forEach(batalla => {
                        const tr = document.createElement('tr');
                        tr.id = `batalla-${batalla.id}`;
                        tr.innerHTML = `
                            <td>${batalla.id}</td>
                            <td>${new Date(batalla.fecha).toLocaleDateString()}</td>
                            <td>${batalla.usuario.nombre}</td>
                            <td>${batalla.brawler.nombre}</td>
                            <td>${batalla.resultado}</td>
                        `;
                        contenidoBatallas.appendChild(tr);
                    });
                })
                .catch(error => console.error('Error fetching batallas:', error));
        });
        </script>
</body>
</html>
